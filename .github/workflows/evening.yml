# 평일 저녁 '저녁판'(규칙 선별판): 공개 전 검사·테스트 → 텔레그램 공개 채널 수집·묶기·점수·조립·검사 → 봇 커밋 → Pages 배포
#
# 가장 중요한 선: 채널 글의 글자는 공개되는 것(data/*.json · 아티팩트 · 이 로그)에 한 글자도 나가지 않는다.
# 나가는 것은 사전 낱말 · 출처 라벨 · 고정 문구 · 숫자+허용 단위 · 시각 · https://t.me/<목록의 채널>/<글 번호>,
# 그리고 이 저장소가 쓴 낱말 풀이 · 규칙에 적힌 공공 기관 주소 · 글 길이 구간 · 사전 낱말 수 · 그림·파일 표시뿐이다.
#
# 순서와 이유
#   check     모든 실행에서 먼저. 공개 전 검사(check_blind)와 저녁 테스트가 통과해야 뒤로 간다. 저녁 테스트는 여기서만 돈다
#             (scripts/evening/에는 __init__.py가 없어 아침의 "discover -s scripts"가 줍지 않는다 — 저녁 코드가 아침 갱신을 막지 않게).
#             예약·수동 실행은 가지의 '지금' 끝을 받아 그 커밋을 뒤 잡들에 넘긴다(같은 그룹의 앞 실행을 기다린 사이 main이 움직였을 수 있다).
#   켜는 스위치  저장소 변수 EVENING_ENABLED가 true일 때만 예약 수집 · 게시 · 감시가 돈다. 변수가 없으면 꺼져 있다 — main에 합친 것만으로는
#             채널을 읽지도, 판을 올리지도, 실패 메일을 보내지도 않는다(설계 9절: 켜기 전 3영업일은 PC에서만 돌려 정답지와 견준다).
#             꺼 둔 동안에도 수동 실행(게시·아티팩트 없는 시험 수집)과 내리기는 된다.
#   collect   17:41 예약(켜 둔 때만)과 수동 실행에서. 읽기 권한뿐이고 Secret이 없다 — 채널 글을 읽는 잡은 저장소에 쓰지 못한다.
#             원문은 러너의 .work/evening/에만 있고 러너와 함께 사라진다(actions/cache 없음, 아티팩트에도 없음).
#             아티팩트로 넘기는 것은 검사를 통과한 저녁판 파일뿐이고(폴더 통째가 아니다), 게시할 때만 올린다 — 하루 뒤 지워진다.
#             단계가 실패한 날은 판 없이 '실행 실패' 상태만 넘긴다.
#   publish   쓰기 권한이 있고 채널 글을 읽지 않는다. 아티팩트를 받아 원문 없이 다시 검사하고(digest_check --strict), 저녁판 파일만 data/로
#             옮긴 뒤 새 산출물까지 공개 전 검사를 거쳐 봇이 커밋한다. main에서만, 켜 둔 때만.
#   takedown  수동 실행에서 takedown을 켰을 때만. 수집하지 않고 저녁 자료를 빈 판으로 바꿔 커밋한다(지난 판 파일·목차도 지운다).
#             저녁 테스트에 기대지 않는다(check가 그 단계를 건너뛴다) — 테스트가 깨진 날에도 내릴 수 있게. 공개 전 검사는 거친다.
#             빈 판조차 못 만드는 날(저녁 코드가 깨진 날)에는 저녁판 파일을 지운다 — 화면은 '판 없음'을 보여 준다.
#             내리기는 지금 올라가 있는 것을 내릴 뿐이다. 다음 예약 실행이 다시 올리지 않게 하려면 EVENING_ENABLED를 true가 아닌 값으로
#             바꾼다(또는 지운다). main이 아닌 가지에서 누르면 아무것도 내리지 못하므로 실행을 실패로 끝낸다.
#   watch     22:41 예약에서만. 수집하지 않는다(텔레그램 요청 0회). main의 data/digest_status.json이 오늘 판인지, 공개 페이지의 것과
#             같은지만 본다. main에는 있는데 페이지가 옛것이면 배포만 다시 하고, main에도 없으면 실행을 실패로 끝낸다.
#   deploy    data/·site/만 Pages로(daily.yml의 deploy와 같은 조립). 봇의 push는 다른 워크플로를 깨우지 않으므로 여기서 직접 배포한다.
#   alert     수집 부족 · 꼭 볼 것 0건 연속 · 미리보기 형식 바뀜 · 채널 바뀜 · 단계 실패인 날은 게시·배포를 마친 뒤 실행을 실패로 끝내
#             GitHub 알림 메일을 받는다.
#
# 아침(daily.yml)과 같은 concurrency 그룹을 쓴다 — 두 워크플로가 동시에 커밋·배포하지 않게. 같은 그룹에서 기다리는 실행은 하나뿐이라
# 새 실행이 오면 먼저 기다리던 실행이 취소될 수 있다. 그 빈자리와, 기다리던 push 실행이 옛 커밋을 배포해 저녁판이 사라지는 경우를
# 22:41 감시가 잡는다.
# 액션은 커밋 SHA로 고정한다(태그가 옮겨져도 코드가 바뀌지 않게). 올릴 때는 SHA와 주석의 버전을 함께 바꾼다.
# 셸에 넣는 값은 env로 넘긴다 — run 안에는 Actions 표현식(달러 + 겹중괄호)을 쓰지 않는다.

name: evening

on:
  push:
    branches: [main]
    paths:
      - "scripts/evening/**"
      - "site/evening.*"
      - "data/sources.json"
      - "data/calendar.json"
      # data/digest_picks.json(PC가 올리는 AI 요약 층)은 넣지 않는다 — 그 push의 검사와 배포는 daily.yml의 push 실행이 한다.
      # 여기에도 걸면 같은 concurrency 그룹에 실행이 둘 서고, 기다리던 배포가 뒤따른 실행에 밀려 취소될 수 있다
      - ".github/workflows/evening.yml"
  schedule:
    - cron: "41 8 * * 1-5"    # UTC 월~금 08:41 = KST 17:41 수집(국내 마감 뒤). 수십 분~몇 시간 늦을 수 있다
    - cron: "41 13 * * 1-5"   # UTC 월~금 13:41 = KST 22:41 감시(수집 예약 + 5시간)
  workflow_dispatch:
    inputs:
      takedown:
        description: "내리기 — 수집하지 않고 저녁 자료를 빈 판으로 바꿔 다시 배포한다"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      # 다른 가지에서 내리기를 누르면 내리기 잡이 건너뛰어져 '성공'으로 보인다 — 아무것도 안 내린 채 조용히 끝나지 않게 여기서 멈춘다
      - name: 내리기는 main에서만
        if: inputs.takedown == true && github.ref != 'refs/heads/main'
        run: |
          echo "::error::내리기는 main 가지에서만 돈다 — 가지를 main으로 골라 다시 실행한다"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # 공개 전 검사는 과거 커밋 전체를 본다(얕은 클론이면 검사 불가로 멈춘다)
          # push는 그 커밋, 예약·수동 실행은 가지의 지금 끝
          ref: ${{ github.event_name == 'push' && github.sha || github.ref }}
      - name: 검사한 커밋 기록
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      # 브랜치·태그는 위 checkout이 받는다. notes만 더 받는다(PR 참조는 받지 않는다 — daily.yml과 같은 이유)
      - name: notes 받기
        run: git fetch --quiet origin '+refs/notes/*:refs/notes/*'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: 공개 전 검사
        env:
          BLIND_PATTERNS: ${{ secrets.BLIND_PATTERNS }}
        run: python scripts/check_blind.py
      - name: 저녁 테스트
        if: inputs.takedown != true   # 내리기는 테스트에 기대지 않는다
        run: python -m unittest discover -s scripts/evening

  collect:
    needs: check
    # 예약 수집은 켜 둔 때만 — 꺼 둔 동안에는 채널을 읽지 않는다. 수동 실행은 게시 없는 시험 수집으로 남긴다
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '41 8 * * 1-5' && vars.EVENING_ENABLED == 'true') ||
      (github.event_name == 'workflow_dispatch' && inputs.takedown != true)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.run.outputs.publish }}
      alert: ${{ steps.run.outputs.alert }}
      reason: ${{ steps.run.outputs.reason }}
      stage: ${{ steps.run.outputs.stage }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.check.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      # 수집(채널당 미리보기 1쪽, 3초 간격, 30요청·6분 상한) → 묶기 → 점수 → 조립 → 검사(원문과 대조).
      # 로그에는 개수·날짜·코드만 남는다. 공개 JSON은 _evening/에, 원문은 .work/evening/에만 생긴다
      - name: 수집·묶기·점수·조립·검사
        id: run
        timeout-minutes: 15
        run: >-
          python scripts/evening/evening_run.py pipeline
          --work .work/evening --out _evening --data data --github-output "$GITHUB_OUTPUT"
      # 게시할 때만 올린다(공개 저장소의 아티팩트는 로그인한 누구나 받는다) — 저녁판 파일 이름만 골라서, 하루만 둔다
      - name: 공개 JSON만 아티팩트로
        if: steps.run.outputs.publish == 'true' && vars.EVENING_ENABLED == 'true' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evening-public
          path: |
            _evening/digest.json
            _evening/digest_*.json
            _evening/digest/*.json
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [check, collect]
    # main에서만 — 다른 브랜치에서 수동 실행하면 그 브랜치 커밋이 main으로 밀려 올라간다
    if: >-
      needs.collect.outputs.publish == 'true' && github.ref == 'refs/heads/main' &&
      vars.EVENING_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # 봇이 data/의 저녁판 파일을 커밋한다
    outputs:
      publish: ${{ steps.commit.outputs.publish }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.check.outputs.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: evening-public
          path: _evening
      - name: 다시 검사(원문 없이)
        run: python scripts/evening/digest_check.py --public _evening --strict --sources data/sources.json
      - name: 저녁판 파일만 data/로
        run: |
          python scripts/evening/digest_publish.py --from _evening --data data
          rm -r _evening
      - name: notes 받기
        run: git fetch --quiet origin '+refs/notes/*:refs/notes/*'
      - name: 공개 전 검사(새 산출물 포함)
        env:
          BLIND_PATTERNS: ${{ secrets.BLIND_PATTERNS }}
        run: python scripts/check_blind.py
      - name: 봇 커밋
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit --quiet -m "data: $(python -c 'import json; print(json.load(open("data/digest_status.json"))["edition"])') 저녁판 자동 갱신"
            git pull --quiet --rebase origin main
            git push --quiet origin HEAD:main
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"   # deploy는 검사를 거친 이 커밋을 배포한다

  takedown:
    needs: check
    if: github.event_name == 'workflow_dispatch' && inputs.takedown == true && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # 봇이 빈 판을 커밋한다
    outputs:
      publish: ${{ steps.commit.outputs.publish }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.check.outputs.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      # 오늘 판을 빈 판(status withdrawn)으로, 지난 판 파일·목차·꼭 볼 것의 id를 지운다. 출처 목록이나 상태 파일이 깨져 있어도 돈다.
      # 다음 예약 실행이 다시 올리지 않게 하려면 저장소 변수 EVENING_ENABLED를 끄거나(true가 아닌 값) data/digest_overrides.json의 withdraw
      - name: 저녁 자료를 빈 판으로
        id: blank
        continue-on-error: true
        run: python scripts/evening/digest_build.py --blank --out data --data data
      # 저녁 코드가 깨져 빈 판조차 못 만드는 날에도 내려가야 한다 — 그때는 저녁판 파일을 지운다(화면은 '판 없음'을 보여 준다)
      - name: 빈 판을 못 만들면 저녁판 파일을 지운다
        if: steps.blank.outcome == 'failure'
        run: |
          echo "::warning::빈 판을 만들지 못해 저녁판 파일을 지웠다 — scripts/evening/digest_build.py --blank 확인"
          rm -f data/digest.json data/digest_index.json data/digest_state.json data/digest_status.json data/digest_picks.json
          rm -rf data/digest
      - name: notes 받기
        run: git fetch --quiet origin '+refs/notes/*:refs/notes/*'
      - name: 공개 전 검사(새 산출물 포함)
        env:
          BLIND_PATTERNS: ${{ secrets.BLIND_PATTERNS }}
        run: python scripts/check_blind.py
      - name: 봇 커밋
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit --quiet -m "data: $(date -u +%F) 저녁판 내림"
            git pull --quiet --rebase origin main
            git push --quiet origin HEAD:main
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  watch:
    needs: check
    if: >-
      github.event_name == 'schedule' && github.event.schedule == '41 13 * * 1-5' &&
      vars.EVENING_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      redeploy: ${{ steps.watch.outputs.redeploy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.check.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      # 요청은 공개 페이지의 data/digest_status.json 한 번뿐이다. main에 오늘 판이 없으면 이 단계가 실패한다(메일)
      - name: 오늘 판이 main과 공개 페이지에 있는지
        id: watch
        run: >-
          python scripts/evening/evening_run.py watch --data data
          --page-url "https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}"
          --github-output "$GITHUB_OUTPUT"

  deploy:
    needs: [check, publish, takedown, watch]
    if: >-
      always() && needs.check.result == 'success' &&
      (needs.publish.outputs.publish == 'true' || needs.takedown.outputs.publish == 'true' ||
       needs.watch.outputs.redeploy == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 검사를 거친 커밋 — 게시·내리기는 봇이 방금 올린 커밋, 감시는 check가 검사한 main의 끝
          ref: ${{ needs.publish.outputs.sha || needs.takedown.outputs.sha || needs.check.outputs.sha }}
      - name: 사이트 조립(site/ + data/만)
        run: |
          mkdir -p _site/data
          cp -r site/. _site/
          if [ -d data ]; then cp -r data/. _site/data/; fi
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  alert:
    needs: [collect, publish, deploy]
    if: always() && needs.collect.outputs.alert == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 저녁판 실패 알림
        env:
          REASON: ${{ needs.collect.outputs.reason }}
          STAGE: ${{ needs.collect.outputs.stage }}
        run: |
          case "$REASON" in
            short) echo "::error::수집 부족 — 채권 3곳 미만 또는 전체 16곳 미만만 읽혔다. 꼭 볼 것을 비운 판이 나갔다. 채널별 숫자는 data/digest_status.json. 못 읽은 글은 다음 판이 다시 읽는다 — 오늘 판을 채우려면 오늘 안에 수동 실행으로 다시 돌린다" ;;
            empty_streak) echo "::error::꼭 볼 것 0건이 3판 연속 — 판은 나갔다. 게이트 숫자(digest_rules.py)나 묶기가 맞는지 확인" ;;
            broken) echo "::error::미리보기 형식이 바뀐 것으로 보인다(본문 비율이 절반 아래) — 판을 내지 않았다. 페이지는 직전 판을 보여 준다" ;;
            channel) echo "::error::채널 확인 필요 — data/digest_status.json의 code와 fail_streak를 본다. title: 제목 해시가 목록과 다르다. 제목만 바뀐 것이면 collect 로그의 title_sha= 값을 data/sources.json에 옮긴다. rewind: 글 번호가 거꾸로 갔다(이름이 다른 채널로 넘어갔을 수 있다) — 스스로 풀리지 않는다. 채널을 확인한 뒤 한 판 동안 목록에서 빼거나 off로 두었다가 되돌리면 새로 읽는다. 그 밖: 채권 채널이 3판 이어서 안 읽혔다 — 미리보기가 꺼졌으면 목록에서 뺀다" ;;
            *) echo "::error::저녁판 실행 실패(단계: $STAGE) — 페이지는 직전 판과 실패 표시를 보여 준다. 원인은 collect 잡의 로그" ;;
          esac
          exit 1
