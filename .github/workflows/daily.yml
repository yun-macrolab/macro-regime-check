# 평일 아침 자동 갱신: 공개 전 검사·테스트 → FRED 수집·판정 → 공개본·상태 기록 → 봇 커밋 → Pages 배포
#
# 순서와 이유
#   check   모든 실행에서 먼저. 공개 전 검사(check_blind)와 단위 테스트가 통과해야 뒤로 간다.
#           예약·수동 실행은 가지의 '지금' 끝을 받아 그 커밋을 update에 넘긴다(evening.yml의 check와 같다 — 같은 그룹의 앞 실행을
#           기다린 사이 main이 움직였을 수 있다. 실행이 걸린 때의 커밋에서 시작하면 기다리던 수동 실행이 앞 실행의 봇 커밋과
#           data/status.json에서 rebase 충돌을 낸다 — 2026-11-10 점검 shell-06).
#   update  예약·수동 실행에서만. 수집·공개본 생성은 실패해도 멈추지 않고(continue-on-error) 상태 파일에 실패를 남긴다
#           → 페이지는 직전 공개본 + 실패 배너를 보여 준다. 새 산출물까지 다시 검사한 뒤에만 커밋한다.
#           그래프 자료(charts.json)는 공개본 뒤에 만든다. 실패하면 직전 그래프가 남고 페이지가 그 기준일을 알린다
#           (상태 파일의 정상 여부는 바꾸지 않는다 — 규칙 판정은 멀쩡하므로).
#           국고채 참고 자료(ktb.json)는 FRED 쪽 성공 여부와 상관없이 받는다. 실패하면 직전 자료가 남는다
#           (규칙 판정과 무관한 참고 절이라 상태 파일도 바꾸지 않는다).
#           수급 참고 자료(supply.json — 뉴욕 연은 딜러 순포지션 · FRED WMTSECL1)도 따로 받는다. 한쪽이 실패하면 그쪽만
#           직전 값을 '받지 못함'과 함께 남긴다. 이 단계는 실패해도 알림(alert)에 넣지 않는다 — 규칙 판정과 무관한 참고 칸이라
#           매일 실패 메일이 오지 않게(뉴욕 연은 단일 시계열 주소의 응답 형식은 2026-11-10 한 번 받아 확인했다).
#           한쪽 실패는 그 단계 로그의 경고 줄(::warning:: — 실행 요약에 보이고 단계는 초록)과 페이지의 '받지 못함'·'자료 없음'으로,
#           두 쪽 다 실패하면 그 단계가 빨간 표시(실행 결과는 성공)로 보인다.
#           AI 투자 참고 자료(ai_invest.json — FRED 공개 통계, 재배포 제한 지수는 상관·회귀 계수만)도 같은 원칙이다: 칸마다 따로,
#           못 받은 칸은 직전 값을 '받지 못함'과 함께 남기고 경고 줄을 찍는다. 알림에 넣지 않는다.
#           유가·에너지 참고 자료(oil.json — FRED 공개 통계, 물가 묶음의 참고 카드와 한국 시장의 두 줄)도 같은 원칙이다.
#           2026-10-30 더한 참고 자료 다섯과 2026-11-03 더한 연준 재무상태표도 같은 원칙이다(칸마다 따로, 못 받으면 직전 값을
#           '받지 못함'과 함께, 알림 없음):
#             SEC 공시 조달(sec.json — SEC EDGAR XBRL, 연락처는 비밀 SEC_USER_AGENT에서만, 그 단계에만 넘긴다)
#             → 신용 긴축(credit.json — FRED + 연준 이사회 EBP · 뉴욕 연은 CMDI, sec.json을 읽으므로 SEC 다음)
#             · 지준·재정(liquidity.json — FRED)
#             · 연준 재무상태표(fedbs.json — FRED: 연준 이사회 H.4.1 주간 열·IORB·BEA GDP + 뉴욕 연은 SOFR·상시 레포·익일물
#             역레포, 2026-11-03 더함. H.4.1은 목 16:30 미 동부에 나와 이 예약 실행(UTC 22:17)이 같은 날 받는다. 같은 날 더한
#             RMP 칸(rmp_view — 계획 = Operational Details 페이지 1번 · 대조 = Markets API 국채 운영 결과 1번(RMP 시작 달
#             2025-12부터), 둘이 합쳐 25초)은 뉴욕 연은에서 직접 받는다 — 계획을 못 받으면 그 칸만 직전 값, 운영 결과를 못
#             받으면 그 칸의 대조 한 줄만 미수신)
#             · 기간 프리미엄 모형 대조(tp.json — FRED Kim-Wright + 뉴욕 연은 ACM) · 단일종목 CDS(cds.json·cds_days.json —
#             DTCC 공개 거래 보고 하루 파일, 빠진 날만 이어 받는다)
#           한국 시장 자료(korea.json)는 시작·종료 기록(korea_status.py → korea-status.json) 사이에서 받는다. 일부 묶음이라도
#           실패하면 알림(alert)에 넣는다.
#   deploy  data/·site/만 Pages로. 스크립트·원자료(.work/)는 배포하지 않는다.
#           push 실행은 배포 직전에 main의 끝을 다시 받아, 그사이 main이 그 커밋보다 앞서 나갔으면 배포를 건너뛴다(2026-11-04 검토
#           push-4) — 같은 그룹에서 기다리던 push 실행이 예약 실행이 방금 배포한 봇 커밋(아침 자료) 뒤에 옛 커밋을 다시 배포하지 않게.
#           더 새 커밋은 그것을 올린 실행이 배포한다(PC의 push는 제 push 실행, 봇 커밋은 그 예약 실행). 끝을 받지 못하면 그대로 배포한다.
#   alert   수집·생성·그래프·국고채 참고 자료·한국 시장 자료가 실패한 날은 마지막에 실행을 실패로 끝내 GitHub 알림 메일을 받는다.
#
# 원자료 캐시(actions/cache)는 쓰지 않는다 — 재배포가 제한된 시리즈(S&P·ICE·Moody's) 원값이 러너 밖에 남지 않게.
# 캐시가 없으면 FRED가 일부 시리즈만 실패한 날 그 값은 비고(2개까지 허용), 3개 이상이면 그날은 기록하지 않는다.
# 액션은 커밋 SHA로 고정한다(태그가 옮겨져도 코드가 바뀌지 않게). 올릴 때는 SHA와 주석의 버전을 함께 바꾼다.

name: daily

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 22 * * 1-5"   # UTC 월~금 22:17 = KST 화~토 07:17 (미국 영업일 다음 날 아침). 실제로는 몇 시간 늦게 돈다(2026-09-28~11-06 예약 30번: 2~5시간)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # 공개 전 검사는 과거 커밋 전체를 본다(얕은 클론이면 검사 불가로 멈춘다)
          # push는 그 커밋, 예약·수동 실행은 가지의 지금 끝
          ref: ${{ github.event_name == 'push' && github.sha || github.ref }}
      - name: 검사한 커밋 기록
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      # 브랜치·태그는 위 checkout이 받는다. notes만 더 받는다.
      # PR 참조(refs/pull)는 받지 않는다 — 이 저장소는 PR을 쓰지 않고, 남이 연 PR이 검사를 영구히 막거나
      # (지울 수 없는 참조) 공개 로그로 검사어를 떠보는 통로가 되지 않게.
      - name: notes 받기
        run: git fetch --quiet origin '+refs/notes/*:refs/notes/*'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: PDF 읽기 의존성 설치
        run: python -m pip install -r requirements.txt
      - name: 공개 전 검사
        env:
          BLIND_PATTERNS: ${{ secrets.BLIND_PATTERNS }}
        run: python scripts/check_blind.py
      - name: 단위 테스트
        run: |
          python -m unittest discover -s scripts
          node --test scripts/test_korea_health.cjs
          node --test scripts/test_notes_render.cjs
          node --test scripts/test_oil_render.cjs
          node --test scripts/test_ai_invest_render.cjs
          node --test scripts/test_tp_render.cjs
          node --test scripts/test_liquidity_render.cjs
          node --test scripts/test_fedbs_render.cjs
          node --test scripts/test_credit_render.cjs
          node --test scripts/test_cds_render.cjs
          node --test scripts/test_people_render.cjs
          node --test scripts/test_supply_ktb_render.cjs

  update:
    needs: check
    # main에서만 — 다른 브랜치에서 수동 실행하면 그 브랜치 커밋이 main으로 밀려 올라간다
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30        # 참고 자료 단계 제한의 합(국고채 2 + 수급 2 + AI 2 + SEC 2 + 신용 2 + 지준 2 + 연준 재무상태표 2 + 기간 프리미엄 2 + CDS 2 + 유가 2 + 한국 4 = 24분)과 수집 — 넘치면 상태·커밋·배포가 다 빠진다
    permissions:
      contents: write   # 봇이 data/를 커밋한다
    outputs:
      ok: ${{ steps.status.outputs.ok }}
      charts: ${{ steps.charts.outcome }}
      ktb: ${{ steps.ktb.outcome }}
      korea: ${{ steps.korea_finish.outputs.ok == 'true' && 'success' || 'failure' }}
      publish: ${{ steps.commit.outputs.publish }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.check.outputs.sha }}   # check가 검사하고 테스트한 커밋에서 시작한다
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: PDF 읽기 의존성 설치
        run: python -m pip install -r requirements.txt
      - name: 수집·판정 (FRED 23개 시리즈)
        id: fetch
        continue-on-error: true
        run: python scripts/regime_check.py
      - name: 공개본 만들기
        id: render
        if: steps.fetch.outcome == 'success'
        continue-on-error: true
        run: python scripts/render_public.py
      - name: 그래프 자료 만들기
        id: charts
        if: steps.render.outcome == 'success'
        continue-on-error: true
        run: python scripts/render_charts.py
      # 공개 통계가 아닌 참고 자료 — 증권사 리서치팀 텔레그램 공개 채널의 일일동향 글에서 국고채 금리 숫자만(하루 1회 요청)
      - name: 국고채 참고 자료 받기
        id: ktb
        continue-on-error: true
        timeout-minutes: 2
        run: python scripts/ktb_fetch.py
      # 참고 자료 — 미 국채 수급 두 지표(뉴욕 연은 요청 1회 + FRED 요청 1회). 규칙 판정에 쓰지 않고, 실패해도 알림 없음(머리말)
      - name: 수급 참고 자료 받기
        id: supply
        continue-on-error: true
        timeout-minutes: 2
        run: python scripts/supply_fetch.py
      # 참고 자료 — AI 투자(FRED 공개 통계 + 재배포 제한 지수는 상관·회귀 계수만, 요청 30회, 전체 80초 상한). 규칙 판정에 쓰지
      # 않고, 실패해도 알림 없음
      - name: AI 투자 참고 자료 받기
        id: ai_invest
        continue-on-error: true
        timeout-minutes: 2
        run: python scripts/ai_invest_fetch.py
      # 참고 자료 — 하이퍼스케일러 조달·조달 흐름·재무상태 잔액(SEC EDGAR XBRL, 요청 68회 — 흐름 37 다음 잔액 31, 간격 0.25초,
      # 전체 60초 상한). 연락처는 비밀에서만 — 이 단계에만 넘긴다(비밀이 없으면 요청 없이 '연락처 미설정'). 실패해도 알림 없음
      - name: SEC 공시 조달 참고 자료 받기
        id: sec
        continue-on-error: true
        timeout-minutes: 2
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python scripts/sec_fetch.py
      # 참고 자료 — 신용 긴축(요청 15번: FRED 8개 → 연준 이사회 EBP CSV 1 → 뉴욕 연은 CMDI 통합 문서 1 → 회사채 흐름 Z.1
      # FRED 5 — 예산이 모자라면 회사채 흐름부터 빠진다, 요청마다 min(10초, 남은 예산), 전체 60초 상한 — 단계 2분 안. 바로 앞
      # 단계의 sec.json을 읽는다). 연준 이사회·뉴욕 연은에는
      # 프로젝트를 밝히는 User-Agent(이메일 없음), FRED는 기본 머리글. 규칙 판정에 쓰지 않고, 실패해도 알림 없음
      - name: 신용 긴축 참고 자료 받기
        id: credit
        continue-on-error: true
        timeout-minutes: 2
        run: python scripts/credit_fetch.py
      # 참고 자료 — 지준·재정(FRED 공개 통계, 요청 11회, 전체 60초 상한). 규칙 판정에 쓰지 않고, 실패해도 알림 없음
      - name: 지준·재정 참고 자료 받기
        id: liquidity
        continue-on-error: true
        timeout-minutes: 2
        run: python scripts/liquidity_fetch.py
      # 참고 자료 — 연준 재무상태표(H.4.1 주간 · FRED 공개 통계 + 뉴욕 연은 인용 필요 시리즈, FRED 요청 14회 · 전체 60초 상한 +
      # 뉴욕 연은 2회 — RMP 칸(rmp_view)의 공식 계획 페이지 · 국채 운영 결과(RMP 시작 달부터), 둘이 합쳐 25초 상한).
      # 규칙 판정에 쓰지 않고, 실패해도 알림 없음
      - name: 연준 재무상태표 참고 자료 받기
        id: fedbs
        continue-on-error: true
        timeout-minutes: 2
        run: python scripts/fedbs_fetch.py
      # 참고 자료 — 기간 프리미엄 모형 대조(FRED Kim-Wright 2회 + 뉴욕 연은 ACM 1회, 전체 45초 상한). 실패해도 알림 없음
      - name: 기간 프리미엄 모형 대조 참고(Kim-Wright · ACM)
        id: tp
        continue-on-error: true
        timeout-minutes: 2
        run: python scripts/tp_fetch.py
      # 참고 자료 — 단일종목 CDS(DTCC 공개 거래 보고 하루 파일, 빠진 날만 · 전체 90초 굳은 상한). 규칙 판정에 쓰지 않고, 실패해도 알림 없음
      - name: 단일종목 CDS 참고 자료 받기
        id: cds
        continue-on-error: true
        timeout-minutes: 2
        run: python scripts/cds_fetch.py
      # 참고 자료 — 유가·에너지(FRED 공개 통계, 요청 16회, 전체 60초 상한). 규칙 판정에 쓰지 않고, 실패해도 알림 없음
      - name: 유가·에너지 참고 자료 받기
        id: oil
        continue-on-error: true
        timeout-minutes: 2
        run: python scripts/oil_fetch.py
      - name: 한국 시장 갱신 시작 기록
        id: korea_start
        run: python scripts/korea_status.py --state started
      - name: 한국 시장 학습 자료 받기
        id: korea
        continue-on-error: true
        timeout-minutes: 4         # 수신 예산 180초(korea_market.PublicFetcher) + 마지막 요청 10초 + PDF·쓰기 — 4분 안
        run: python scripts/korea_market.py
      - name: 한국 시장 갱신 종료 기록
        id: korea_finish
        if: always() && steps.korea_start.outcome == 'success'
        env:
          KOREA_OUTCOME: ${{ steps.korea.outcome }}
        run: python scripts/korea_status.py --state "$KOREA_OUTCOME"
      - name: 상태 기록
        id: status
        env:
          FETCH: ${{ steps.fetch.outcome }}
          RENDER: ${{ steps.render.outcome }}
        run: |
          mkdir -p data
          python scripts/write_status.py --fetch "$FETCH" --render "$RENDER"
          echo "ok=$(python -c 'import json; print(str(json.load(open("data/status.json"))["ok"]).lower())')" >> "$GITHUB_OUTPUT"
      - name: notes 받기
        run: git fetch --quiet origin '+refs/notes/*:refs/notes/*'
      - name: 공개 전 검사(새 산출물 포함)
        env:
          BLIND_PATTERNS: ${{ secrets.BLIND_PATTERNS }}
        run: python scripts/check_blind.py
      - name: 봇 커밋
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit --quiet -m "data: $(date -u +%F) 자동 갱신"
            # 실행 중 main에 들어온 커밋(PC의 발언·AI 요약 push 같은)이 있으면 그 위에 얹는다. 그 커밋은 위 공개 전 검사가 본 것이
            # 아니다 — 올린 쪽의 push 전 검사(훅 · people_push · picks_push)를 거쳤고, 그 push로 시작한 실행이 같은 그룹에서 이 실행 뒤에 제 check로
            # 다시 검사한다. 그 실행은 main이 앞서 나갔으니 배포를 건너뛰고(deploy의 'main이 앞서 나갔는지'), 그 커밋은 이 실행의 배포로 나간다
            git pull --quiet --rebase origin main
            git push --quiet origin HEAD:main
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"   # deploy가 배포할 커밋 — 위에서 검사한 봇 커밋(rebase로 딸려 온 커밋은 위 주석)

  deploy:
    needs: [check, update]
    if: >-
      always() && needs.check.result == 'success' &&
      (github.event_name == 'push' || needs.update.outputs.publish == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 예약·수동 실행은 봇이 방금 올린 커밋(rebase로 딸려 온 커밋은 봇 커밋 단계의 주석), push는 check가 검사한 그 커밋
          ref: ${{ needs.update.outputs.sha || github.sha }}
      # push 실행만: main이 이 커밋보다 앞서 나갔으면(기다리는 사이 예약 실행의 봇 커밋 · 다른 push) 아래 배포 셋을 건너뛴다.
      # 예약 · 수동 실행은 이 단계를 건너뛰어 지금처럼 배포한다. main의 끝을 받지 못하면 경고만 남기고 그대로 배포한다
      - name: main이 앞서 나갔는지(push 실행만)
        id: tip
        if: github.event_name == 'push'
        run: |
          if ! git fetch --quiet --no-tags --depth=1 origin main; then
            echo "::warning::main의 끝을 받지 못했다 — 이 커밋을 그대로 배포한다"
            echo "newer=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tip="$(git rev-parse FETCH_HEAD)"
          if [ "$tip" = "$GITHUB_SHA" ]; then
            echo "newer=false" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::main이 이 커밋보다 앞서 나갔다($tip) — 배포를 건너뛴다. 더 새 커밋은 그것을 올린 실행이 배포한다"
            echo "newer=true" >> "$GITHUB_OUTPUT"
          fi
      - name: 사이트 조립(site/ + data/만)
        run: |
          mkdir -p _site/data
          cp -r site/. _site/
          if [ -d data ]; then cp -r data/. _site/data/; fi
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        if: steps.tip.outputs.newer != 'true'
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: steps.tip.outputs.newer != 'true'
        with:
          path: _site
      - id: deployment
        if: steps.tip.outputs.newer != 'true'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  alert:
    needs: [update, deploy]
    if: >-
      always() && needs.update.result == 'success' &&
      (needs.update.outputs.ok != 'true' || needs.update.outputs.charts == 'failure' ||
       needs.update.outputs.ktb == 'failure' || needs.update.outputs.korea == 'failure')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: 갱신 실패 알림
        env:
          OK: ${{ needs.update.outputs.ok }}
          CHARTS: ${{ needs.update.outputs.charts }}
          KTB: ${{ needs.update.outputs.ktb }}
          KOREA: ${{ needs.update.outputs.korea }}
        run: |
          if [ "$KOREA" = "failure" ]; then
            echo "::error::한국 시장 자료 일부 수신 실패 — korea.json의 항목별 상태와 마지막 성공일 확인"
          fi
          if [ "$KTB" = "failure" ]; then
            echo "::error::국고채 참고 자료 수신 실패 — 페이지는 직전에 읽은 값과 그 날짜를 보여 준다. 채널 글 형식이 바뀌었는지는 update 잡의 국고채 단계 로그"
          fi
          if [ "$OK" != "true" ]; then
            echo "::error::오늘 갱신 실패 — 페이지는 직전 공개본과 실패 배너를 보여 준다. 원인은 update 잡의 수집·판정 단계 로그"
          fi
          if [ "$CHARTS" = "failure" ]; then
            echo "::error::그래프 자료 생성 실패 — 페이지는 직전 그래프와 기준일 안내를 보여 준다. 원인은 update 잡의 그래프 단계 로그"
          fi
          exit 1
